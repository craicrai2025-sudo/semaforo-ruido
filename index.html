<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semáforo de Ruido</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(to bottom right, #87cefa, #d0e7ff);
      transition: background 0.3s;
    }

    h1 {
      font-size: 2.5em;
      font-weight: bold;
      margin-top: 20px;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 40px;
    }

    .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 90%;
      margin: auto;
    }

    /* Barra de sonido */
    .bar-container {
      width: 52px;  /* 40px + 30% */
      height: 390px; /* 300px + 30% */
      background: #eee;
      border-radius: 20px;
      overflow: hidden;
      margin-left: 40px;
      display: flex;
      align-items: flex-end; /* Para que crezca desde abajo */
    }

    .bar {
      width: 100%;
      height: 0%;
      background: green;
      transition: height 0.1s, background 0.1s;
    }

    /* Imagen del centro */
    .wolf {
      flex: 1;
      text-align: center;
    }

    .wolf img {
      width: 200px;
    }

    /* Semáforo fijo a la derecha */
    .traffic-light {
      margin-right: 40px;
    }

    .traffic-light img {
      width: 120px;
    }
  </style>
</head>
<body>
  <h1>🚦 Semáforo de Ruido</h1>
  <p>Este semáforo muestra el nivel de ruido en diferentes colores.</p>

  <div class="container">
    <!-- Barra de sonido -->
    <div class="bar-container">
      <div class="bar" id="bar"></div>
    </div>

    <!-- Imagen central -->
    <div class="wolf">
      <img id="wolfImage" src="verde.png" alt="Imagen central">
    </div>

    <!-- Semáforo fijo -->
    <div class="traffic-light">
      <img src="semaforo.png" alt="Semáforo">
    </div>
  </div>

  <script>
    let blinkInterval = null;

    // Función para interpolar colores
    function interpolateColor(color1, color2, factor) {
      let result = color1.slice();
      for (let i = 0; i < 3; i++) {
        result[i] = Math.round(result[i] + factor * (color2[i] - color1[i]));
      }
      return result;
    }

    function rgbToCss(rgb) {
      return "rgb(" + rgb.join(",") + ")";
    }

    // Acceder al micrófono
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      const audioContext = new AudioContext();
      const source = audioContext.createMediaStreamSource(stream);
      const analyser = audioContext.createAnalyser();
      analyser.fftSize = 256;
      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      source.connect(analyser);

      const bar = document.getElementById("bar");
      const wolfImage = document.getElementById("wolfImage");

      function animate() {
        analyser.getByteFrequencyData(dataArray);
        let values = 0;
        for (let i = 0; i < dataArray.length; i++) {
          values += dataArray[i];
        }
        let average = values / dataArray.length;

        // Normalizamos el volumen (0 - 100)
        let volume = Math.min(100, (average / 255) * 100);

        bar.style.height = volume + "%";

        // Colores: verde → amarillo → rojo
        let green = [0, 255, 0];
        let yellow = [255, 255, 0];
        let red = [255, 0, 0];
        let color;

        if (volume <= 50) {
          let factor = volume / 50; // 0 a 1
          color = interpolateColor(green, yellow, factor);
        } else {
          let factor = (volume - 50) / 50; // 0 a 1
          color = interpolateColor(yellow, red, factor);
        }

        bar.style.background = rgbToCss(color);

        // Cambiar la imagen según el nivel
        if (volume <= 40) {
          wolfImage.src = "verde.png";
          stopBlink();
          document.body.style.background = "linear-gradient(to bottom right, #87cefa, #d0e7ff)";
        } else if (volume <= 70) {
          wolfImage.src = "amarillo.png";
          stopBlink();
          document.body.style.background = "linear-gradient(to bottom right, #87cefa, #d0e7ff)";
        } else {
          wolfImage.src = "rojo.png";
          startBlink();
        }

        requestAnimationFrame(animate);
      }

      animate();
    });

    function startBlink() {
      if (blinkInterval) return; // si ya está titilando, no duplicar
      blinkInterval = setInterval(() => {
        document.body.style.background =
          document.body.style.background.includes("black")
            ? "red"
            : "black";
      }, 300);
    }

    function stopBlink() {
      if (blinkInterval) {
        clearInterval(blinkInterval);
        blinkInterval = null;
      }
    }
  </script>
</body>
</html>
