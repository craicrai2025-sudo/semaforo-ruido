<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Volumen con barra</title>
  <style>
    body {
      background: linear-gradient(to right, #b3d9ff, #e6f2ff);
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 0 50px; /* margen para no pegarlo a los bordes */
    }

    /* Barra de sonido */
    .barra {
      width: 40px;
      height: 300px;
      background: #333;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.4);
    }

    .nivel {
      position: absolute;
      bottom: 0; /* ahora empieza desde abajo */
      width: 100%;
      height: 0;
      background: green;
      border-radius: 20px 20px 0 0;
      transition: height 0.1s ease;
    }

    /* Imagen central (lobo PNG) */
    .lobo-centro {
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .lobo-centro img {
      max-height: 300px;
    }

    /* Imagen derecha */
    .derecha {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .derecha img {
      width: 200px; /* tamaño del lobo (doble de lo que estaba antes aprox) */
    }

    .derecha p {
      font-size: 20px;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <!-- Barra de sonido -->
  <div class="barra">
    <div class="nivel" id="nivel"></div>
  </div>

  <!-- Lobo al centro -->
  <div class="lobo-centro">
    <img src="lobo.png" alt="Lobo">
  </div>

  <!-- Imagen y texto a la derecha -->
  <div class="derecha">
    <img src="lobo_derecha.png" alt="Lobo grande">
    <p>Normal</p>
  </div>

  <script>
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(stream => {
        const audioContext = new AudioContext();
        const source = audioContext.createMediaStreamSource(stream);
        const analyser = audioContext.createAnalyser();
        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        source.connect(analyser);

        function actualizarBarra() {
          analyser.getByteFrequencyData(dataArray);
          let volumen = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
          let altura = Math.min(100, (volumen / 255) * 100); // porcentaje

          document.getElementById("nivel").style.height = altura + "%";
          requestAnimationFrame(actualizarBarra);
        }

        actualizarBarra();
      })
      .catch(err => console.error("Error accediendo al micrófono:", err));
  </script>
</body>
</html>
