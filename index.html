<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semáforo de Ruido</title>

  <style>
    body {
      margin: 0;
      /* Fondo degradado: azul más claro en el centro, un poco más oscuro en los bordes */
      background: radial-gradient(circle, #E0F7FA 0%, #90CAF9 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      display: flex;
      justify-content: center; /* centra los elementos */
      align-items: center;
      gap: 50px; /* espacio entre la barra, imagen central y semáforo */
      max-width: 1000px; /* ancho máximo para no pegarse a los bordes */
      width: 90%;
    }

    .barra {
      width: 70px;
      height: 300px;
      background: #333;
      border-radius: 20px;
      overflow: hidden;
    }

    #nivel {
      width: 100%;
      height: 0%;
      background: green;
      transition: height 0.1s linear, background 0.2s linear;
    }

    .imagen-central img {
      width: 300px;
    }

    .semaforo img {
      width: 300px;
    }

    /* Botón de iniciar */
    #contenedorBoton {
      margin-top: 20px;
    }

    #btnIniciar {
      padding: 10px 20px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Barra de sonido -->
    <div class="barra">
      <div id="nivel"></div>
    </div>

    <!-- Imagen central -->
    <div class="imagen-central">
      <img id="imagenCentral" src="imagenes/normal.png" alt="Estado">
    </div>

    <!-- Semáforo -->
    <div class="semaforo">
      <img id="semaforoImg" src="imagenes/semaforo-verde.png" alt="Semáforo">
    </div>
  </div>

  <!-- Botón solo si es necesario -->
  <div id="contenedorBoton" style="display:none;">
    <button id="btnIniciar">Iniciar</button>
  </div>

  <script>
    let audioContext;
    let analyser;
    let dataArray;

    async function iniciarMicrofono() {
      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

        const source = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        source.connect(analyser);

        dataArray = new Uint8Array(analyser.frequencyBinCount);

        medirRuido();
        document.getElementById("contenedorBoton").style.display = "none"; // ocultar botón
      } catch (error) {
        console.error("Error al acceder al micrófono:", error);
      }
    }

    function medirRuido() {
      requestAnimationFrame(medirRuido);

      analyser.getByteFrequencyData(dataArray);

      let valores = dataArray.reduce((a, b) => a + b, 0);
      let promedio = valores / dataArray.length;

      let porcentaje = Math.min(100, (promedio / 255) * 100);

      const nivel = document.getElementById("nivel");
      nivel.style.height = porcentaje + "%";

      const imagenCentral = document.getElementById("imagenCentral");
      const semaforoImg = document.getElementById("semaforoImg");

      if (porcentaje < 33) {
        nivel.style.background = "green";
        semaforoImg.src = "imagenes/semaforo-verde.png";
        imagenCentral.src = "imagenes/normal.png";
      } else if (porcentaje < 66) {
        nivel.style.background = "yellow";
        semaforoImg.src = "imagenes/semaforo-amarillo.png";
        imagenCentral.src = "imagenes/alerta.png";
      } else {
        nivel.style.background = "red";
        semaforoImg.src = "imagenes/semaforo-rojo.png";
        imagenCentral.src = "imagenes/peligro.png";
      }
    }

    // Intentar iniciar automáticamente al cargar
    window.addEventListener("load", async () => {
      try {
        await iniciarMicrofono();
      } catch (error) {
        // Si el navegador no permite auto-inicio, mostramos botón
        document.getElementById("contenedorBoton").style.display = "block";
      }
    });

    // Evento del botón Iniciar
    document.getElementById("btnIniciar").addEventListener("click", () => {
      iniciarMicrofono();
    });
  </script>
</body>
</html>
