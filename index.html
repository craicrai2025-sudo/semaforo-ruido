<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Semáforo de Ruido</title>
  <style>
    :root{
      --base-blue: #d0e7ff;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(to bottom right, #87cefa, var(--base-blue));
      transition: background 0.25s ease;
    }

    /* ====== HERO (títulos) ====== */
    .hero-wrap{
      display:flex; justify-content:center; margin: 12px 0 6px;
      padding: 8px 16px;
    }
    .hero{ text-align:center; }

    /* Estilo A: texto con degradado verde→turquesa */
    .hero.style-a h1{
      font-size: clamp(2.8rem, 5vw, 4rem);
      font-weight: 800; line-height: 1.05; margin: 12px 0 4px;
      background: linear-gradient(90deg,#64dd17,#00bcd4);
      -webkit-background-clip: text; color: transparent;
      text-shadow: 0 1px 1px rgba(0,0,0,.12);
    }
    .hero.style-a h2{ font-size: clamp(1.2rem,2.5vw,1.6rem); font-weight:700; opacity:.9; margin:0 0 6px; }
    .hero.style-a p{ margin: 6px 0 0; opacity:.85; }

    /* Estilo B: tarjeta “glass” */
    .hero.style-b{
      display:inline-block; padding: 14px 22px; border-radius: 18px;
      background: rgba(255,255,255,.45); backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
    }
    .hero.style-b h1{ font-size: clamp(2.6rem,4.6vw,3.6rem); margin:0; font-weight:800; }
    .hero.style-b h2{ font-size: clamp(1.1rem,2.1vw,1.5rem); margin:4px 0 2px; font-weight:700; color:#1a1a1a; }
    .hero.style-b p{ margin:6px 0 0; opacity:.85; }

    /* Estilo C: mayúsculas con contorno y sombra */
    .hero.style-c h1{
      font-size: clamp(2.8rem,5.2vw,4.2rem);
      font-weight: 900; text-transform: uppercase; letter-spacing:.04em;
      color:#111; -webkit-text-stroke:1px rgba(255,255,255,.6);
      text-shadow: 0 8px 24px rgba(0,0,0,.25);
      margin: 12px 0 6px;
    }
    .hero.style-c h2{ font-size: clamp(1.2rem,2.4vw,1.6rem); font-weight:700; opacity:.95; margin:0 0 6px; }
    .hero.style-c p{ margin:6px 0 0; opacity:.85; }

    /* ====== LAYOUT principal ====== */
    .container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;  /* centramos el lobo */
      width: 90%;
      margin: 0 auto 40px auto;
      gap: 32px;
      min-height: 620px;
    }

    /* Barra de sonido fija a la izquierda */
    .bar-container {
      position: absolute;
      left: 150px;
      top: 50%;
      transform: translateY(-50%);
      width: 70px;
      height: 600px;
      background: #eeeeee;
      border-radius: 22px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      box-shadow: 0 6px 16px rgba(0,0,0,0.15) inset;
    }

    .bar {
      width: 100%;
      height: 0%;
      background: #00c853; /* se reemplaza dinámicamente */
      transition: height 0.10s linear, background 0.10s linear;
    }

    /* Imagen central (lobo) */
    .center{
      flex: 0 1 100%;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #estadoImg {
      width: 600px;       /* NO cambiamos el tamaño de la imagen */
      max-width: 300vw;
      height: auto;
      user-select: none;
    }
  </style>
</head>
<body>
  <!-- ====== CAMBIA style-a por style-b o style-c para ver otro look ====== -->
  <div class="hero-wrap">
    <div class="hero style-a" id="hero">
      <h1>Bienvenidas y bienvenidos al CRAI UR</h1>
      <h2>Calmómetro</h2>
      <p>Bájale al ruido, súbele a la concentración</p>
    </div>
  </div>

  <div class="container">
    <!-- Barra de sonido -->
    <div class="bar-container">
      <div id="bar" class="bar"></div>
    </div>

    <!-- Imagen central -->
    <div class="center">
      <img id="estadoImg" src="imagenes/verde.png" alt="Estado de ruido">
    </div>
  </div>

  <script>
    // ===== Utilidades de color =====
    function lerp(a, b, t) { return a + (b - a) * t; }
    function mixRGB(c1, c2, t) {
      return [
        Math.round(lerp(c1[0], c2[0], t)),
        Math.round(lerp(c1[1], c2[1], t)),
        Math.round(lerp(c1[2], c2[2], t)),
      ];
    }
    function rgbStr([r,g,b]) { return `rgb(${r}, ${g}, ${b})`; }

    const GREEN  = [0, 255, 0];
    const YELLOW = [255, 255, 0];
    const RED    = [255, 0, 0];
    const BASE_BLUE = getComputedStyle(document.documentElement)
                      .getPropertyValue('--base-blue').trim() || "#d0e7ff";

    // ===== Parpadeo de fondo en nivel peligro =====
    let blinkInterval = null;
    function startBlink() {
      if (blinkInterval) return;
      let toggle = false;
      blinkInterval = setInterval(() => {
        document.body.style.background = toggle 
          ? 'black' 
          : 'linear-gradient(to bottom right, red, darkred)';
        toggle = !toggle;
      }, 300);
    }
    function stopBlink() {
      if (blinkInterval) {
        clearInterval(blinkInterval);
        blinkInterval = null;
      }
    }

    // ===== Audio + Animación =====
    (async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const audioContext = new AudioCtx();
        const source = audioContext.createMediaStreamSource(stream);
        const analyser = audioContext.createAnalyser();
        analyser.fftSize = 256; // potencia de 2 válida
        source.connect(analyser);

        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        const barEl = document.getElementById('bar');
        const estadoImg = document.getElementById('estadoImg');

        function frame() {
          analyser.getByteFrequencyData(dataArray);

          // Promedio simple para un "nivel" de 0..100
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
          const avg = sum / dataArray.length;

          // Normalizar a porcentaje
          const sensitivity = 1.5; // ajusta la sensibilidad
          const volume = Math.min(100, (avg / 255) * 100 * sensitivity);

          // Altura de la barra
          barEl.style.height = volume + '%';

          // Color progresivo
          let color;
          if (volume <= 50) {
            color = mixRGB(GREEN, YELLOW, volume / 50);
          } else {
            color = mixRGB(YELLOW, RED, (volume - 50) / 50);
          }
          const colorStr = rgbStr(color);
          barEl.style.background = colorStr;

          // Fondo degradado dinámico (si no está parpadeando)
          if (!blinkInterval) {
            document.body.style.background =
              `linear-gradient(to bottom right, ${colorStr}, ${BASE_BLUE})`;
          }

          // Imagen + parpadeo según umbrales
          if (volume <= 40) {
            if (!estadoImg.src.includes('verde.png')) estadoImg.src = 'imagenes/verde.png';
            stopBlink();
          } else if (volume <= 70) {
            if (!estadoImg.src.includes('amarillo.png')) estadoImg.src = 'imagenes/amarillo.png';
            stopBlink();
          } else {
            if (!estadoImg.src.includes('rojo.png')) estadoImg.src = 'imagenes/rojo.png';
            startBlink();
          }

          requestAnimationFrame(frame);
        }

        frame();
      } catch (err) {
        alert('Error accediendo al micrófono: ' + err.name + ' - ' + err.message +
              '\n\n🔧 Revisa:\n1. Que uses HTTPS\n2. Que el micrófono esté permitido (candado en la URL)\n3. Que no esté ocupado por otro programa.');
        console.error(err);
      }
    })();
  </script>
</body>
</html>
