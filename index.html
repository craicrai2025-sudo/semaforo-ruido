<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semáforo de Ruido</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f4f9;
    }
    h1 {
      color: #333;
    }
    .contenedor {
      margin-top: 20px;
    }
    .estado {
      margin: 20px;
    }
    .estado img {
      width: 120px;
      height: auto;
    }
  </style>
</head>
<body>
  <h1>🚦 Semáforo de Ruido 🚦</h1>
  <p>Este semáforo muestra el nivel de ruido con diferentes colores.</p>

  <div class="contenedor">
    <div class="estado">
      <h2>Nivel Normal</h2>
      <img src="imagenes/normal.png" alt="Normal">
      <br>
      <img src="imagenes/semaforo_verde.png" alt="Semáforo Verde">
    </div>

    <div class="estado">
      <h2>Nivel Alerta</h2>
      <img src="imagenes/alerta.png" alt="Alerta">
      <br>
      <img src="imagenes/semaforo_amarillo.png" alt="Semáforo Amarillo">
    </div>

    <div class="estado">
      <h2>Nivel Peligro</h2>
      <img src="imagenes/peligro.png" alt="Peligro">
      <br>
      <img src="imagenes/semaforo_rojo.png" alt="Semáforo Rojo">
    </div>
  </div>
</body>
</html>
