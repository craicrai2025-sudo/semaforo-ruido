<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semáforo</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      /* Fondo degradado azul pastel mate */
      background: radial-gradient(
        circle,
        #e9f6ff 0%,   /* azul casi blanco en el centro */
        #cfe9ff 50%,  /* azul mate pastel intermedio */
        #b5dbff 100%  /* azul pastel suave en bordes */
      );
    }

    .contenedor {
      display: flex;
      align-items: center;
      gap: 40px;
    }

    .columna {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    .columna img {
      width: 100px;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <div class="columna">
      <img src="normal.png" alt="Normal">
      <img src="alerta.png" alt="Alerta">
      <img src="peligro.png" alt="Peligro">
    </div>
    <div class="columna">
      <img src="semaforo-verde.png" alt="Semáforo Verde">
      <img src="semaforo-amarillo.png" alt="Semáforo Amarillo">
      <img src="semaforo-rojo.png" alt="Semáforo Rojo">
    </div>
  </div>
</body>
</html>
