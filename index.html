<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medidor de Ruido</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: radial-gradient(circle, #d7ecfa, #a7d3f2);
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
    }

    .bar-container {
      width: 60px;
      height: 300px;
      background: #333;
      border-radius: 30px;
      overflow: hidden;
      margin: 20px auto;
      box-shadow: 0px 4px 8px rgba(0,0,0,0.2);
    }

    .bar {
      width: 100%;
      height: 0%;
      background: green;
      transition: height 0.3s ease-out, background 0.3s;
    }

    .status-image {
      margin-top: 20px;
      height: 150px;
      transition: transform 0.3s;
    }

    .status-text {
      margin-top: 10px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="bar-container">
      <div class="bar" id="bar"></div>
    </div>
    <img id="statusImage" class="status-image" src="imagenes/verde.png" alt="Estado">
    <div id="statusText" class="status-text">Normal</div>
  </div>

  <script>
    async function initMicrophone() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);
        const analyser = audioContext.createAnalyser();
        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        source.connect(analyser);

        let smoothedLevel = 0; // nivel suavizado

        function update() {
          analyser.getByteTimeDomainData(dataArray);

          // calcular nivel RMS (volumen promedio)
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) {
            let value = (dataArray[i] - 128) / 128;
            sum += value * value;
          }
          let rms = Math.sqrt(sum / dataArray.length);
          let targetLevel = Math.min(100, rms * 500);

          // suavizado (interpolación)
          smoothedLevel = smoothedLevel * 0.8 + targetLevel * 0.2;

          const bar = document.getElementById("bar");
          const statusImage = document.getElementById("statusImage");
          const statusText = document.getElementById("statusText");

          bar.style.height = smoothedLevel + "%";

          if (smoothedLevel < 40) {
            bar.style.background = "green";
            statusImage.src = "imagenes/verde.png";
            statusText.textContent = "Normal";
          } else if (smoothedLevel < 70) {
            bar.style.background = "yellow";
            statusImage.src = "imagenes/amarillo.png";
            statusText.textContent = "Alerta";
          } else {
            bar.style.background = "red";
            statusImage.src = "imagenes/rojo.png";
            statusText.textContent = "Peligro";
          }

          requestAnimationFrame(update);
        }

        update();
      } catch (err) {
        alert("No se pudo acceder al micrófono: " + err);
        console.error(err);
      }
    }

    initMicrophone();
  </script>
</body>
</html>
