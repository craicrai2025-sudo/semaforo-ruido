<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semáforo de Ruido</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: radial-gradient(circle, #dbeafe, #bfdbfe, #93c5fd);
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    h1 {
      margin-top: 10px;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: center;
      justify-items: center;
      flex-grow: 1;
      width: 100%;
      padding: 20px;
    }

    /* Barra de sonido */
    #sound-bar {
      width: 40px;
      height: 250px;
      background: #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
    }

    #sound-level {
      width: 100%;
      height: 0;
      background: linear-gradient(to top, #34d399, #facc15, #f87171);
      transition: height 0.1s;
    }

    /* Imagen del lobo */
    .wolf img {
      max-width: 200px;
    }

    /* Semáforo */
    .traffic-light img {
      max-width: 100px;
      display: block;
      margin: 10px auto;
    }
  </style>
</head>
<body>
  <h1>🚦 Semáforo de Ruido 🐺</h1>
  <p>Este semáforo muestra el nivel de ruido en diferentes colores.</p>

  <div class="container">
    <!-- Barra de sonido -->
    <div class="sound-meter">
      <div id="sound-bar">
        <div id="sound-level"></div>
      </div>
    </div>

    <!-- Lobo en el centro -->
    <div class="wolf">
      <img id="wolf" src="imagenes/normal.png" alt="Lobo">
    </div>

    <!-- Semáforo a la derecha -->
    <div class="traffic-light">
      <img id="semaforo" src="imagenes/semaforo-verde.png" alt="Semáforo">
    </div>
  </div>

  <script>
    // Acceso al micrófono y control de barra
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(stream => {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const analyser = audioContext.createAnalyser();
        const source = audioContext.createMediaStreamSource(stream);
        source.connect(analyser);

        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        function updateSoundBar() {
          analyser.getByteFrequencyData(dataArray);
          let volume = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
          let height = Math.min(100, (volume / 255) * 100);
          document.getElementById("sound-level").style.height = height + "%";

          // Cambiar imágenes según el volumen
          const wolf = document.getElementById("wolf");
          const semaforo = document.getElementById("semaforo");

          if (height < 33) {
            wolf.src = "imagenes/normal.png";
            semaforo.src = "imagenes/semaforo-verde.png";
          } else if (height < 66) {
            wolf.src = "imagenes/alerta.png";
            semaforo.src = "imagenes/semaforo-amarillo.png";
          } else {
            wolf.src = "imagenes/peligro.png";
            semaforo.src = "imagenes/semaforo-rojo.png";
          }

          requestAnimationFrame(updateSoundBar);
        }

        updateSoundBar();
      })
      .catch(err => {
        console.error("Error al acceder al micrófono:", err);
      });
  </script>
</body>
</html>
