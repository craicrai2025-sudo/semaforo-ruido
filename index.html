<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semáforo de Ruido</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(to bottom right, #87cefa, #d0e7ff);
    }

    h1 {
      font-size: 2.5em;
      font-weight: bold;
      margin-top: 20px;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 40px;
    }

    .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 90%;
      margin: auto;
    }

    /* Barra de sonido */
    .bar-container {
      width: 40px;
      height: 300px;
      background: #eee;
      border-radius: 20px;
      overflow: hidden;
      margin-left: 40px; /* margen para que no quede pegada */
    }

    .bar {
      width: 100%;
      height: 0%;
      background: green;
      transition: height 0.1s, background 0.2s;
    }

    /* Imagen del lobo centrada */
    .wolf {
      flex: 1;
      text-align: center;
    }

    .wolf img {
      width: 200px;
    }

    /* Semáforo a la derecha */
    .traffic-light {
      margin-right: 40px;
    }

    .traffic-light img {
      width: 120px;
    }
  </style>
</head>
<body>
  <h1>🚦 Semáforo de Ruido</h1>
  <p>Este semáforo muestra el nivel de ruido en diferentes colores.</p>

  <div class="container">
    <!-- Barra de sonido -->
    <div class="bar-container">
      <div class="bar" id="bar"></div>
    </div>

    <!-- Imagen del lobo -->
    <div class="wolf">
      <img src="lobo.png" alt="Lobo">
    </div>

    <!-- Imagen del semáforo -->
    <div class="traffic-light">
      <img src="semaforo.png" alt="Semáforo">
    </div>
  </div>

  <script>
    // Acceder al micrófono
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      const audioContext = new AudioContext();
      const source = audioContext.createMediaStreamSource(stream);
      const analyser = audioContext.createAnalyser();
      analyser.fftSize = 256;
      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      source.connect(analyser);

      const bar = document.getElementById("bar");

      function animate() {
        analyser.getByteFrequencyData(dataArray);
        let values = 0;
        for (let i = 0; i < dataArray.length; i++) {
          values += dataArray[i];
        }
        let average = values / dataArray.length;

        // Normalizamos el volumen (0 - 100)
        let volume = Math.min(100, (average / 255) * 100);

        bar.style.height = volume + "%";

        // Cambiar color según el nivel
        if (volume < 33) {
          bar.style.background = "green";
        } else if (volume < 66) {
          bar.style.background = "yellow";
        } else {
          bar.style.background = "red";
        }

        requestAnimationFrame(animate);
      }

      animate();
    });
  </script>
</body>
</html>
