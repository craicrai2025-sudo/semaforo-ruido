<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de Imágenes con Barra de Sonido</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #d9ecff, #a9d4f7);
      font-family: Arial, sans-serif;
    }

    .contenedor {
      display: flex;
      flex-direction: row;
      gap: 80px;
    }

    .imagenes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px 40px;
      align-items: center;
    }

    .imagenes img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      display: block;
      margin-bottom: 5px;
    }

    .barra-sonido {
      width: 20px;
      height: 150px;
      background: #333;
      border-radius: 12px;
      margin-left: 40px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
    }

    .nivel {
      width: 100%;
      background: linear-gradient(to top, #4CAF50, #8BC34A);
      height: 0;
      transition: height 0.1s linear;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <!-- Barra de sonido -->
    <div class="barra-sonido">
      <div class="nivel" id="nivel"></div>
    </div>

    <!-- Imágenes -->
    <div class="imagenes">
      <div><img src="imagenes/normal.png" alt="Normal"><br>Normal</div>
      <div><img src="imagenes/semaforo-verde.png" alt="Semáforo Verde"><br>Semáforo Verde</div>
      <div><img src="imagenes/alerta.png" alt="Alerta"><br>Alerta</div>
      <div><img src="imagenes/semaforo-amarillo.png" alt="Semáforo Amarillo"><br>Semáforo Amarillo</div>
      <div><img src="imagenes/peligro.png" alt="Peligro"><br>Peligro</div>
      <div><img src="imagenes/semaforo-rojo.png" alt="Semáforo Rojo"><br>Semáforo Rojo</div>
    </div>
  </div>

  <script>
    // Captura el micrófono y anima la barra
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(stream => {
        const audioContext = new AudioContext();
        const source = audioContext.createMediaStreamSource(stream);
        const analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        source.connect(analyser);

        const nivel = document.getElementById('nivel');

        function animar() {
          analyser.getByteFrequencyData(dataArray);
          let volumen = dataArray.reduce((a, b) => a + b) / dataArray.length;
          let porcentaje = Math.min(volumen / 2, 100);
          nivel.style.height = porcentaje + "%";
          requestAnimationFrame(animar);
        }

        animar();
      })
      .catch(err => {
        console.error("Error accediendo al micrófono: ", err);
      });
  </script>
</body>
</html>
