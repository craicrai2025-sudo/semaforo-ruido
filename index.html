<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Semáforo de Ruido</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(to bottom right, #87cefa, #d0e7ff);
      transition: background 0.25s ease;
    }

    h1 {
      font-size: 2.2rem;
      margin: 20px 0 8px;
    }

    p {
      margin: 0 0 28px;
      opacity: 0.9;
    }

    /* Layout: barra a la izquierda, imagen al centro */
    .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 90%;
      margin: 0 auto 40px auto;
      gap: 32px;
    }

    /* Barra de sonido */
    .bar-container {
      width: 70px;
      height: 600px;
      background: #eeeeee;
      border-radius: 22px;
      overflow: hidden;
      margin-left: 150px;
      display: flex;
      align-items: flex-end;
      box-shadow: 0 6px 16px rgba(0,0,0,0.15) inset;
    }

    .bar {
      width: 100%;
      height: 0%;
      background: #00c853; /* se reemplaza dinámicamente */
      transition: height 0.10s linear, background 0.10s linear;
    }

    /* Imagen central */
    .center {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 420px;
    }

    #estadoImg {
      width: 400px;
      max-width: 100vw;
      height: auto;
      user-select: none;
    }
  </style>
</head>
<body>
  <h1>BIENVENIDOS AL CRAI</h1>
  <h2>🚦 Semáforo de Ruido 🚦</h2>
  <p>Recuerda mantener un nivel de ruido adecuado al lugar</p>

  <div class="container">
    <!-- Barra de sonido -->
    <div class="bar-container">
      <div id="bar" class="bar"></div>
    </div>

    <!-- Imagen central -->
    <div class="center">
      <img id="estadoImg" src="imagenes/verde.png" alt="Estado de ruido">
    </div>
  </div>

  <script>
    // ===== Utilidades de color =====
    function lerp(a, b, t) { return a + (b - a) * t; }
    function mixRGB(c1, c2, t) {
      return [
        Math.round(lerp(c1[0], c2[0], t)),
        Math.round(lerp(c1[1], c2[1], t)),
        Math.round(lerp(c1[2], c2[2], t)),
      ];
    }
    function rgbStr([r,g,b]) { return `rgb(${r}, ${g}, ${b})`; }

    const GREEN  = [0, 255, 0];
    const YELLOW = [255, 255, 0];
    const RED    = [255, 0, 0];
    const BASE_BLUE = "#d0e7ff"; // azul claro de fondo

    // ===== Parpadeo de fondo en nivel peligro =====
    let blinkInterval = null;
    function startBlink() {
      if (blinkInterval) return;
      let toggle = false;
      blinkInterval = setInterval(() => {
        document.body.style.background = toggle 
          ? 'black' 
          : 'linear-gradient(to bottom right, red, darkred)';
        toggle = !toggle;
      }, 300);
    }
    function stopBlink() {
      if (blinkInterval) {
        clearInterval(blinkInterval);
        blinkInterval = null;
      }
    }

    // ===== Audio + Animación =====
    (async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const audioContext = new AudioCtx();
        const source = audioContext.createMediaStreamSource(stream);
        const analyser = audioContext.createAnalyser();
        analyser.fftSize = 255;
        source.connect(analyser);

        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        const barEl = document.getElementById('bar');
        const estadoImg = document.getElementById('estadoImg');

        function frame() {
          analyser.getByteFrequencyData(dataArray);

          // Promedio simple para un "nivel" de 0..100
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
          const avg = sum / dataArray.length;
          const volume = Math.min(100, (avg / 100) * 100);

          // Altura de la barra
          barEl.style.height = volume + '%';

          // Color progresivo
          let color;
          if (volume <= 50) {
            color = mixRGB(GREEN, YELLOW, volume / 50);
          } else {
            color = mixRGB(YELLOW, RED, (volume - 50) / 50);
          }
          const colorStr = rgbStr(color);
          barEl.style.background = colorStr;

          // Fondo degradado dinámico (con base azul)
          if (!blinkInterval) {
            document.body.style.background = `linear-gradient(to bottom right, ${colorStr}, ${BASE_BLUE})`;
          }

          // Imagen + parpadeo según umbrales
          if (volume <= 40) {
            if (estadoImg.src.indexOf('imagenes/verde.png') === -1) {
              estadoImg.src = 'imagenes/verde.png';
            }
            stopBlink();
          } else if (volume <= 70) {
            if (estadoImg.src.indexOf('imagenes/amarillo.png') === -1) {
              estadoImg.src = 'imagenes/amarillo.png';
            }
            stopBlink();
          } else { // 71% .. 100%
            if (estadoImg.src.indexOf('imagenes/rojo.png') === -1) {
              estadoImg.src = 'imagenes/rojo.png';
            }
            startBlink();
          }

          requestAnimationFrame(frame);
        }

        frame();
      } catch (err) {
        alert('No se pudo acceder al micrófono. Verifica permisos HTTPS/localhost.');
        console.error(err);
      }
    })();
  </script>
</body>
</html>
